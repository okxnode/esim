{{- /* header.html — 站点页头与主导航 */ -}}
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ "/" | relLangURL }}">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>eSIM<span class="brand-dot">.ltd</span></span>
      <em>出境上网决策指南</em>
    </a>

    <nav class="site-nav" aria-label="主导航">
      {{- $current := .RelPermalink }}
      {{- range site.Menus.main }}
        {{- $isActive := or (eq $current .URL) (and (ne .URL "/") (hasPrefix $current .URL)) }}
        <a href="{{ .URL | relLangURL }}"{{ if $isActive }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </nav>
    <a class="header-cta" href="{{ "/compare/" | relLangURL }}">开始比价</a>
  </div>
</header>
